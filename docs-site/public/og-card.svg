<?xml version="1.0" encoding="UTF-8"?>
<!--
  og-card.svg — 1200×630 OpenGraph / Twitter card for Jarvis docs.
  Mirrors the HUD's arc-reactor cyan aesthetic so the social card and
  the kiosk read as the same product.

  Why SVG sourced + PNG built: SVG is the editable master (designers
  can tweak text in Figma / hand-edit the XML), but Twitter / Slack /
  Facebook and the GitHub repo social-preview upload all want raster.
  The PNG is generated alongside via tools/build-og.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="reactor" cx="22%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#00d4ff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0077a8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0077a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#02060c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="#02060c"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Reactor on the left third -->
  <g transform="translate(265 315)">
    <circle r="220" fill="url(#reactor)"/>
    <!-- Outer dashed ring -->
    <circle r="190" fill="none" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="6 6"/>
    <!-- Mid ring -->
    <circle r="148" fill="none" stroke="#00d4ff" stroke-opacity="0.55" stroke-width="2"/>
    <!-- Inner dashed ring -->
    <circle r="108" fill="none" stroke="#00d4ff" stroke-opacity="0.65" stroke-width="1.2" stroke-dasharray="3 4"/>
    <!-- Bright core -->
    <circle r="44" fill="#00d4ff" fill-opacity="0.18" stroke="#00d4ff" stroke-width="2.4"/>
    <circle r="14" fill="#e8f4ff"/>
    <!-- Tick marks at cardinal points -->
    <g stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-218" x2="0" y2="-198"/>
      <line x1="218" y1="0" x2="198" y2="0"/>
      <line x1="0" y1="218" x2="0" y2="198"/>
      <line x1="-218" y1="0" x2="-198" y2="0"/>
    </g>
    <!-- Diagonal sweep marks -->
    <g stroke="#00d4ff" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round">
      <line x1="153" y1="-153" x2="139" y2="-139"/>
      <line x1="153" y1="153" x2="139" y2="139"/>
      <line x1="-153" y1="153" x2="-139" y2="139"/>
      <line x1="-153" y1="-153" x2="-139" y2="-139"/>
    </g>
  </g>

  <!-- Right column copy. Oswald + Rubik via inline font-family fallback —
       social platforms rasterise without webfonts so we lean on Arial-Narrow
       /system-ui that read closest to the kiosk's display fonts. -->
  <g font-family="Oswald, 'Arial Narrow', Impact, system-ui, sans-serif">
    <!-- Wordmark + sub -->
    <text x="540" y="220" font-size="120" font-weight="700" fill="#e8f4ff" letter-spacing="6">JARVIS</text>
    <line x1="540" y1="252" x2="1120" y2="252" stroke="url(#rule)" stroke-width="1.6"/>

    <!-- Hero lede (two lines) -->
    <text x="540" y="318" font-size="38" font-weight="500" fill="#e8f4ff" letter-spacing="0.6">A voice-first AI assistant</text>
    <text x="540" y="368" font-size="38" font-weight="500" fill="#e8f4ff" letter-spacing="0.6">with an <tspan fill="#00d4ff" font-weight="700">instrument-cluster HUD</tspan>.</text>

    <!-- Sub-lede -->
    <text x="540" y="430" font-size="22" font-weight="400" font-family="Rubik, system-ui, sans-serif" fill="#8ba6c1" letter-spacing="0.3">Local LLM. Real CPU/GPU temps. Kiosk-mode. White-label.</text>

    <!-- Footer chips -->
    <g transform="translate(540 510)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#00d4ff" letter-spacing="2.4">
      <rect x="0" y="0" width="120" height="36" fill="rgba(0,212,255,0.08)" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="60" y="23" text-anchor="middle">// MIT</text>

      <rect x="135" y="0" width="180" height="36" fill="rgba(0,212,255,0.08)" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="225" y="23" text-anchor="middle">// LOCAL FIRST</text>

      <rect x="330" y="0" width="220" height="36" fill="rgba(0,212,255,0.08)" stroke="#00d4ff" stroke-opacity="0.4" stroke-width="1"/>
      <text x="440" y="23" text-anchor="middle">// APPLE SILICON</text>
    </g>
  </g>

  <!-- Subtle grid overlay top-right -->
  <g stroke="#00d4ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="540" y1="60" x2="1140" y2="60"/>
    <line x1="540" y1="90" x2="1140" y2="90"/>
    <line x1="1080" y1="30" x2="1080" y2="120"/>
    <line x1="1110" y1="30" x2="1110" y2="120"/>
  </g>
  <text x="1140" y="78" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#0077a8" letter-spacing="3">v0.2.0 · MK7</text>
</svg>
