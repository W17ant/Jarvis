<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flat-Out Live Shoot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Mobile-first kiosk-companion view. Same FOM brand vocabulary as the main HUD —
     * red blade accents, monospace numerals, Oswald uppercase labels — but tuned for
     * one-handed phone use during a shoot: enormous mic button, generous tap targets,
     * minimal scrolling. */
    :root {
      --fom-red: #E10600;
      --fom-deep: #8F0003;
      --ink-0: #000;
      --ink-1: #0a0a0a;
      --ink-2: #141414;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f4f4f4;
      --text-dim: rgba(244, 244, 244, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--ink-0);
      color: var(--text);
      font-family: "Rubik", system-ui, sans-serif;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .header {
      flex: 0 0 auto;
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header__title {
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 18px;
      color: var(--fom-red);
    }
    .header__sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--text-dim);
      margin-left: auto;
    }

    .project {
      flex: 0 0 auto;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
    }
    .project__label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .project__select {
      width: 100%;
      background: var(--ink-1);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
    }

    .feed {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 12px 18px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .feed__empty {
      padding: 40px 12px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.5;
    }
    .feed__row {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .feed__row:last-child { border-bottom: none; }
    .feed__time {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }
    .feed__text {
      font-size: 15px;
      line-height: 1.4;
    }
    .feed__row--action .feed__text {
      color: var(--fom-red);
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .actions {
      flex: 0 0 auto;
      padding: 10px 18px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .actions button {
      background: var(--ink-1);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 10px 4px;
      font-family: "Oswald", sans-serif;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .actions button:active { background: var(--fom-red); border-color: var(--fom-red); }
    .actions button.is-hero { color: var(--fom-red); border-color: var(--fom-red); }

    .mic {
      flex: 0 0 auto;
      padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--line);
    }
    .mic__btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--fom-red);
      border: 4px solid var(--ink-0);
      box-shadow: 0 0 0 2px var(--fom-red), 0 0 24px rgba(225, 6, 0, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .mic__btn:active { transform: scale(0.94); }
    .mic__btn.is-recording {
      background: var(--fom-deep);
      box-shadow: 0 0 0 2px var(--fom-red), 0 0 36px rgba(225, 6, 0, 0.8);
      animation: pulse 0.9s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 2px var(--fom-red), 0 0 24px rgba(225, 6, 0, 0.5); }
      50%      { box-shadow: 0 0 0 2px var(--fom-red), 0 0 44px rgba(225, 6, 0, 0.95); }
    }
    .mic__btn svg { width: 36px; height: 36px; fill: white; }
    .mic__hint {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-align: center;
    }
    .mic__status {
      font-family: "Oswald", sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }
    .mic__status.is-error { color: var(--fom-red); }
    .mic__status.is-ok { color: #00ff88; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header__title">FLAT-OUT LIVE</div>
    <div class="header__sub" id="connStatus">connecting…</div>
  </div>

  <div class="project">
    <div class="project__label">Active shoot</div>
    <select class="project__select" id="projectSel">
      <option value="">(loading…)</option>
    </select>
  </div>

  <div class="feed" id="feed">
    <div class="feed__empty">
      Tap the mic to caption the latest shot, flag a hero, or send a note to the editor's HUD.<br/><br/>
      Try: <strong>"flag this as hero"</strong>, <strong>"caption the last frame"</strong>, <strong>"reshoot needed, low light"</strong>.
    </div>
  </div>

  <div class="actions">
    <button id="actHero" class="is-hero">HERO</button>
    <button id="actKeep">KEEP</button>
    <button id="actMaybe">MAYBE</button>
    <button id="actReshoot">RESHOOT</button>
  </div>

  <div class="mic">
    <button class="mic__btn" id="micBtn" type="button" aria-label="Push to talk">
      <svg viewBox="0 0 256 256"><path d="M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0Zm40,143.6V232a8,8,0,0,1-16,0V207.6A80.11,80.11,0,0,1,48,128a8,8,0,0,1,16,0,64,64,0,0,0,128,0,8,8,0,0,1,16,0A80.11,80.11,0,0,1,136,207.6Z"/></svg>
    </button>
    <div class="mic__status" id="micStatus">tap and hold</div>
    <div class="mic__hint">Push-and-hold the mic — release to send.</div>
  </div>

  <script src="live.js" type="module"></script>
</body>
</html>
